<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vinyl-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#eaddcf" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cozy Beats" />
    <link rel="apple-touch-icon" href="/vinyl-icon.svg" />
    <meta name="description" content="Chill & Cozy Offline Music Player - Listen and save relaxing beats without internet." />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts for warm, relaxing, analog & handwritten vibe -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Gaegu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
    
    <title>Cozy Beats • Offline Chill Music</title>
    <script>
      // Automatically refresh stale cached assets if a chunk fails to load
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var k = 'cb_auto_reload_ts';
          var last = sessionStorage.getItem(k);
          var now = Date.now();
          if (!last || now - parseInt(last, 10) > 8000) {
            sessionStorage.setItem(k, now);
            window.location.reload();
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
